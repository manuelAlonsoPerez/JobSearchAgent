# Workday employer registry for JobSearchAgent
# The scraper POSTs to:
#   {base_url}/wday/cxs/{tenant}/{site_id}/jobs
# with the queries from searches.yaml. Location filtering is applied after
# that, so a global board is still useful when it posts Spain or remote roles.
#
# Every entry below answered that API with a live job count.
# Profiles: ServiceNow (CSA/CAD, ITSM, Flow Designer, integrations) and
# full-stack (React, TypeScript, Python, Java, .NET), in Spain or remote.
#
# Not on this Workday API, so they stay on the job boards in sites.yaml:
#   ServiceNow itself (careers.servicenow.com), EY, Capgemini, Sopra Steria,
#   Indra/Minsait, Inetum. Accenture is listed here for discovery. Its URLs
#   match the blocked pattern in sites.yaml, so auto-apply skips them.

employers:

  # ── Spain: banks, product, and industry software ────────────────────────

  santander:
    name: "Santander"
    tenant: "santander"
    site_id: "SantanderCareers"
    base_url: "https://santander.wd3.myworkdayjobs.com"

