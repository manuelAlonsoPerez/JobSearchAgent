# Indeed country. JobSpy expects the lowercase country name.
country: "Norway"

# JobSpy boards. `sites` is the key discovery reads. `boards` is the same
# list for anything that follows this file's original field name.
# ZipRecruiter is US-only. Glassdoor is on the blocked-apply list.
boards:
  - indeed
  - linkedin
sites:
  - indeed
  - linkedin

defaults:
  results_per_site: 50
  # Norway and remote ServiceNow / fullstack / AI ads stay open for weeks.
  # 336 hours = 14 days, matching Indeed fromage=14 in sites.yaml.
  hours_old: 336
  country_indeed: "norway"

# Skip titles that are the wrong seniority or the wrong craft.
# Matched case-insensitively against the job title.
exclude_titles:
