# JobSearchAgent search configuration
# Copy to ~/.applypilot/searches.yaml and customize.
#
# Profiles this file targets:
#   ServiceNow developer / consultant — CSA, CAD, ITSM, Flow Designer,
#   Integration Hub, JavaScript. About 3 years on the platform.
#   Full-stack developer — React, TypeScript, Python, Node, FastAPI,
#   Java, .NET. 8+ years, plus recent RAG / multi-agent work.
#   AI developer — LLM, RAG, GenAI, multi-agent systems.
# Markets for now: Norway (Oslo-based) and truly remote roles. EMEA / EU /
# EEA on a remote listing is acceptable; do not geo-lock the search to EMEA.
#
# The direct-site scraper URL-encodes every query into every search site
# in sites.yaml, and substitutes only the first location below into
# {location_encoded}. Keep that first location as "Norway".
# JobSpy runs every query against every location.
# Single-token queries (ServiceNow, fullstack) are the ones EuroTechJobs
# can put in a URL path. Phrases are for Indeed, LinkedIn, and similar.

# Search queries. Tier 1 first (exact), then broader matches.
queries:
  # ServiceNow
  - query: "ServiceNow developer"
    tier: 1
  - query: "ServiceNow consultant"
    tier: 1
  - query: "ServiceNow utvikler"
    tier: 1
  # Full stack
  - query: "full stack developer"
    tier: 1
  - query: "fullstack utvikler"
    tier: 1
  # AI developer
  - query: "AI developer"
    tier: 1
  - query: "AI engineer"
    tier: 1
  - query: "AI-utvikler"
    tier: 1

  # Same roles, shorter tokens and titles Norwegian boards actually use
  - query: "ServiceNow"
    tier: 2
  - query: "fullstack"
    tier: 2
  - query: "react developer"
    tier: 2
  - query: "python developer"
    tier: 2
  - query: "frontend developer"
    tier: 2
  - query: "backend developer"
    tier: 2
  - query: "LLM engineer"
    tier: 2
  - query: "RAG engineer"
    tier: 2
  - query: "GenAI engineer"
    tier: 2
  - query: "AI software engineer"
    tier: 2

  # Adjacent stacks from the CVs. Wider, lower precision.
  - query: "java developer"
    tier: 3
  - query: ".NET developer"
    tier: 3
  - query: "node.js developer"
    tier: 3
  - query: "machine learning engineer"
    tier: 3
  - query: "applied AI engineer"
    tier: 3
  - query: "multi-agent engineer"
    tier: 3
  - query: "LangChain developer"
    tier: 3
  - query: "utvikler"
    tier: 3

# Locations. The first entry is what {location_encoded} receives.
# Norway: local roles. Remote: any truly remote listing, including those
# LinkedIn only surfaces under Job type = Contract. EMEA is not a search
# geo here — it is an accepted posted location for remote jobs.
locations:
  - location: "Norway"
    remote: false
  - location: "Remote"
    remote: true

# LinkedIn workplace / job-type hints. Remote is the workplace filter.
# Contract is in scope because some true-remote roles are flagged only
# as Contract (or Temporary) and never as Workplace = Remote.
work_types:
  - remote
job_types:
  - full_time
  - contract
  - temporary

# Used by the apply prompt to decide which hybrid/onsite cities are eligible.
# Remote / EMEA / EU / EEA / worldwide stay eligible via the remote terms.
location:
  primary: "Norway"
  accept_patterns:
    - "Norway"
    - "Norge"
    - "Oslo"
    - "Bergen"
    - "Trondheim"
    - "Stavanger"
    - "Drammen"
    - "Tromsø"
