# JobSearchAgent search configuration
# Copy to ~/.applypilot/searches.yaml and customize.
#
# Profiles this file targets:
#   ServiceNow developer / consultant — CSA, CAD, ITSM, Flow Designer,
#   Integration Hub, JavaScript. About 3 years on the platform.
#   Full-stack developer — React, TypeScript, Python, Node, FastAPI,
#   Java, .NET. 8+ years, plus recent RAG / multi-agent work.
# Markets: Spain and remote roles open to the EU/EEA (based in Oslo).
#
# The direct-site scraper URL-encodes every query into every search site
# in sites.yaml, and substitutes only the first location below into
# {location_encoded}. Keep that first location as "Spain".
# JobSpy runs every query against every location.
# Single-token queries (ServiceNow, fullstack) are the ones EuroTechJobs
# can put in a URL path. Phrases are for InfoJobs, Tecnoempleo, Indeed,
# and LinkedIn.

# Search queries. Tier 1 first (exact), then broader matches.
queries:
  # ServiceNow
  - query: "ServiceNow developer"
    tier: 1
  - query: "ServiceNow consultant"
    tier: 1
  - query: "desarrollador ServiceNow"
    tier: 1
  - query: "consultor ServiceNow"
    tier: 1
  # Full stack
  - query: "full stack developer"
    tier: 1
  - query: "desarrollador fullstack"
    tier: 1

  # Same roles, shorter tokens and the titles Spanish boards actually use
  - query: "ServiceNow"
    tier: 2
  - query: "programador ServiceNow"
    tier: 2
  - query: "fullstack"
    tier: 2
  - query: "desarrollador full stack"
    tier: 2
  - query: "react developer"
    tier: 2
  - query: "desarrollador react"
    tier: 2
  - query: "python developer"
    tier: 2
  - query: "desarrollador python"
    tier: 2
  - query: "frontend developer"
    tier: 2
  - query: "desarrollador frontend"
    tier: 2
  - query: "backend developer"
    tier: 2
  - query: "desarrollador backend"
    tier: 2

  # Adjacent stacks from the CVs. Wider, lower precision.
  - query: "java developer"
    tier: 3
  - query: "desarrollador java"
    tier: 3
  - query: ".NET developer"
    tier: 3
  - query: "node.js developer"
    tier: 3
  - query: "AI engineer"
    tier: 3

# Locations. The first entry is what {location_encoded} receives.
locations:
  - location: "Spain"
    remote: false
  - location: "Madrid"
    remote: false
  - location: "Barcelona"
    remote: false
  - location: "Remote"
    remote: true

