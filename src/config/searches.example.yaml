# Discovery reads these two lists (substring, case-insensitive).
# A location containing remote / anywhere / wfh is kept before this runs.
# EMEA / EU / EEA count as acceptable posted locations for remote jobs.
# Norwegian ads often say "hjemmekontor" or "fjernarbeid" and never "remote".
location_accept:
  - "Norway"
  - "Norge"
  - "Oslo"
  - "Bergen"
  - "Trondheim"
  - "Stavanger"
  - "Drammen"
  - "Tromsø"
  - "Tromso"
  - "Kristiansand"
