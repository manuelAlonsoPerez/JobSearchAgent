  # Easy Apply is added dynamically by config.linkedin_search_url().
  # Keep location explicit: omitting it can fall back to the account region.
  # currentJobId is omitted because it only selects a result card.
  - id: linkedin
    name: "LinkedIn Jobs"
    url: "https://www.linkedin.com/jobs/search/?keywords={query_encoded}&location={location_encoded}&f_TPR=r604800&f_WT=2&origin=JOB_SEARCH_PAGE_JOB_FILTER&refresh=true&sortBy=R"
    type: search
    enabled: true
    adapter: linkedin
    auth: login
    supports_query: true
    supports_location: true
    posted_within: native
    work_type: native
    profile: shared

