# JobSearchAgent site registry.
# A scraper fills {query_encoded} and {location_encoded} (both URL-encoded).
#
# Candidate (from work_profiles.yaml): Oslo, EEA-eligible.
# Target: IT roles that are remote, project/contract, or EMEA.
# Profiles: ServiceNow, full-stack (React/TS/Python/Node/Java/.NET), AI/RAG/agents.
#
# enabled: true  → v2 discovery set (remote-first, EMEA tech, contract, LinkedIn, Norway).
# enabled: false → kept for later; Spain-only, LATAM, bot-hostile, or low-signal boards.
#
# Per-site fields:
#   id                 stable slug (thread_id / adapter key)
#   name               display + existing LinkedIn lookup key
#   url                listing or search template
#   type               search | static
#   enabled            whether `run` should walk this site
#   adapter            discovery adapter to use
#   auth               none | login
#   supports_query     URL has {query_encoded} or the adapter can apply queries
#   supports_location  URL has {location_encoded} or the adapter can apply locations
#   posted_within      native | post_filter | unsupported  (--month)
#   work_type          native | url | post_filter | unsupported  (--work-type)
#   profile            shared | dedicated  (Chrome profile)
#
# Query shape: single tokens (servicenow, fullstack, react, python) on path-style
# boards; phrases on LinkedIn, FINN, Welcome to the Jungle, FreelancerMap.

# ── Manual-only ATS domains ──────────────────────────────────────────────
# Jobs that route through these are flagged manual: the bot skips them.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"
    - "%workopolis.com/out%"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used to resolve relative links scraped from a site. Null means the
# scraper must already have absolute URLs.
